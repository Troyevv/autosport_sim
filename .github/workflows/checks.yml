name: Проверки приложения
on: [push, pull_request]
permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: uv run --locked ruff check backend
      - run: uv run --locked python -m pytest -q
  interface:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --locked --python 3.12
        working-directory: .
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
  windows-launcher:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.9'
      - run: python tests/windows_launcher.py

  windows-media:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          path: 'Проект автоспорта'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Build and inspect local media ZIP via batch launcher
        shell: pwsh
        run: |
          $env:UV_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'Инструменты сборки'
          New-Item -ItemType Directory $env:UV_INSTALL_DIR
          $uv = (Get-Command uv.exe).Source
          Copy-Item $uv $env:UV_INSTALL_DIR
          $env:PATH = (($env:PATH -split ';' | Where-Object { $_ -and !(Test-Path (Join-Path $_ 'uv.exe')) }) -join ';')
          cmd.exe /d /c 'call "Проект автоспорта\build_media.bat" <nul'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path 'Проект автоспорта/autosport-2025.zip').Path)
          try {
            $reader = [IO.StreamReader]::new($zip.GetEntry('manifest.json').Open())
            $manifest = $reader.ReadToEnd() | ConvertFrom-Json
            $faces = @($manifest.assets | Where-Object { $_.kind -eq 'generated-head' -and $_.anatomy.body[0].Count -eq 27 })
            $kits = @($manifest.assets | Where-Object { $_.kind -eq 'uniform' -and $_.garment })
            if ($faces.Count -ne 8 -or $kits.Count -ne 4) { throw 'Incomplete R3.2 portrait geometry or wardrobe' }
            if ($manifest.assets.Count -lt 6 -or $zip.Entries.Count -ne ($manifest.assets.Count + 1)) { throw 'Incomplete media ZIP' }
          } finally { $zip.Dispose() }
