name: Проверки приложения
on: [push, pull_request]
permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: uv run --locked python scripts/build_race.py --test
      - name: Проверка пространственного ядра с ASan и UBSan
        run: |
          cmake -S native/race -B build-sanitized -DRACE_PYTHON=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          cmake --build build-sanitized --parallel
          ctest --test-dir build-sanitized --output-on-failure
      - run: uv run --locked ruff check backend scripts/build_race.py scripts/inspect_track.py scripts/inspect_dynamics.py scripts/benchmark_dynamics.py scripts/audit_dynamics.py scripts/compare_dynamics.py
      - run: uv run --locked --extra studio-tools python -m pytest -q
  interface:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --locked --python 3.12
        working-directory: .
      - run: uv run --locked python scripts/build_race.py
        working-directory: .
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
  windows-launcher:
    env:
      PYTHONUTF8: "1"
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.9'
      - run: uv sync --locked --python 3.12
      - run: uv run --locked python scripts/build_race.py --test
      - run: uv run --locked python -m pytest -q backend/test_race_space.py backend/test_race_dynamics.py
      - run: python tests/windows_launcher.py
