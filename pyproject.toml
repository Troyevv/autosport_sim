[project]
name = "autosport-sim"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi==0.165.0",
    "pillow>=11.3,<13",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
media-builder = [
    "opencv-python-headless>=5.1.0.95",
    "resvg-py>=0.5.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.2", "ruff==0.14.6"]
